# Override application image repositories and tags with published images before deployment.
# Database Secrets are external by default; no database passwords are provided here.
global:
  imagePullPolicy: IfNotPresent
  postgresqlSecretName: postgresql-credentials
  mongodbSecretName: mongodb-credentials
frontend:
  image: sausage-frontend:0.1.0
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  containerPort: 80
  service:
    port: 80
  ingress:
    className: nginx
    host: front-dani.2sem.students-projects.ru
    tlsSecretName: 2sem-students-projects-wildcard-secret
    path: /
    pathType: Prefix
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  nginxConf: nginx.conf
backend:
  image: sausage-backend:0.1.0
  replicas: 1
  revisionHistoryLimit: 3
  annotations:
    path: /actuator/prometheus
    port: '8080'
    scrape: 'true'
  env:
    postgresUri: jdbc:postgresql://postgresql:5432/sausage-store
    vaultEnabled: false
    hibernateDdlAuto: validate
    reportPath: /logs/reports
    logPath: /logs
  containerPort: 8080
  service:
    port: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 600m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  vpa:
    enabled: true
    updateMode: 'Off'
backend-report:
  image: sausage-backend-report:0.1.0
  replicas: 1
  revisionHistoryLimit: 3
  containerPort: 8080
  service:
    port: 8080
  strategy:
    type: Recreate
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 75
infra:
  postgresql:
    enabled: true
    image: postgres:14.20-alpine
    auth:
      database: sausage-store
      username: store
      createSecret: false
      password: ''
    persistence:
      size: 1Gi
      storageClass: ''
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  mongodb:
    image: mongo:7.0.14
    replicas: 1
    containerPort: 27017
    auth:
      username: root
      database: sausage-store
      createSecret: false
      password: ''
    persistence:
      size: 1Gi
      storageClass: ''
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 512Mi

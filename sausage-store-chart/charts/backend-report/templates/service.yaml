apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend-report.fullname" . }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend-report.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "backend-report.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-report.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backend-report.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "backend-report.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend-report.labels" . | nindent 8 }}
    spec:
      containers:
        - name: backend-report
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "backend-report.fullname" . }}-conf
                  key: PORT
            - name: DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.mongodbSecretName | quote }}
                  key: uri
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

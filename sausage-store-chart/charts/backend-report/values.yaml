image: sausage-backend-report:0.1.0
replicas: 1
revisionHistoryLimit: 3
containerPort: 8080
service:
  port: 8080
strategy:
  type: Recreate
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 75
global:
  imagePullPolicy: IfNotPresent
  mongodbSecretName: mongodb-credentials

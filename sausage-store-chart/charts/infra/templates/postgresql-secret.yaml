{{- if and .Values.postgresql.enabled .Values.postgresql.auth.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.postgresqlSecretName | quote }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  database: {{ .Values.postgresql.auth.database | quote }}
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ required "Supply infra.postgresql.auth.password externally when createSecret=true" .Values.postgresql.auth.password | quote }}
{{- end }}

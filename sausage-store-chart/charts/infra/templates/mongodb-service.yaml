apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infra.mongodb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.containerPort }}
      targetPort: mongodb
